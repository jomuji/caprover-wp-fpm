; Upload limits must match nginx client_max_body_size (64M).
; Without these, PHP rejects anything over 2M while nginx accepts 64M.
upload_max_filesize = 64M
post_max_size = 64M
memory_limit = 256M
max_execution_time = 300
max_input_time = 300

; Do not advertise the PHP version in responses.
expose_php = Off

; Opcache
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
